name: codelearn_next
description: A multilingual, offline-first programming learning app.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  sembast: ^3.8.5
  sembast_web: ^2.4.0
  path_provider: ^2.1.5
  audioplayers: ^6.5.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0
  web: ^1.1.1
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.40
  flutter_inappwebview: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/audio/
    - assets/runtime/
    - assets/runtime/pyodide/
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
